name: secrets reads

on:
    workflow_dispatch:

jobs:
    check-secret:
        runs-on: ubuntu-latest

        steps:
            - name: check does secret set
              env:
                MY_SECRET: ${{ secrets.MY_SECRET_MESSAGE }}
              run: |
               if [ -n "$MY_SECRET" ]; then
               echo "The secret is set: true"
               else
               echo "the secre is set: false"
               fi


