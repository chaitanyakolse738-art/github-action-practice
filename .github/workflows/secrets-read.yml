name: secrets reads

on:
    workflow_dispatch:

jobs:
    check-secret:
        runs-on: ubuntu-latest

        steps:
            - name: check does secret set
              env:
                MY_SECRET: ${{ secrets.MY_SECRET_MESSAGE }}
              run: |
                if [ -n "$MY_SECRET" ]; then
                    echo "The secret is set: true"
                else
                    echo "The secret is set: false"
                fi

            - name: create file
              run: |
                echo "hello thsi is file gernted" > output.txt
                

            - name: Upload the file as an artifact
              uses: actions/upload-artifact@v4
              with:
                name: shred-text-artifact
                path: output-file.txt

              