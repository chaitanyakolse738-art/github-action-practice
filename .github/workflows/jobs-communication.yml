name: share data between jobs

on:
    workflow_dispatch

    
    jobs:
        
        crate-output:
            runs_on: ubuntu_latest

            outputs:
                today: ${{today_date_bro }}

            steps:
                - name: Genrate and save Date
                  run: echo "current_date"=$(date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

        job 2:
            runs-on: ubuntu-latest
            needs: crete-output

            steps:
                - name: use the passed Date
                  run: echo "the date si passed" ${{needs.crate-output.outpus.today}}


                 
