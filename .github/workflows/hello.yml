name: Hello workflow

on:
  push:
    branches:
      - main

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Hello World
        run: echo "Hello from GitHub Actions!"

      - name: current date & time
        run: echo "$(date "+%Y-%m-%d %H:%M:%S")"